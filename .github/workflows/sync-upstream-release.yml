name: Sync upstream releases and build macOS

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-releases
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'sy1544/iscc-bml-sml' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream releases and plan macOS builds
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: Ivan25rus/iscc-bml-sml
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Start with v0.4.0 and catch releases published between polls.
          releases=$(gh api --paginate "repos/$UPSTREAM/releases?per_page=100" |
            jq -sc 'add | map(select(.draft == false and .published_at >= "2026-11-06T11:41:36Z"))
              | sort_by(.published_at, .id)')
          latest=$(jq -r 'last | .id // empty' <<< "$releases")
          pending='[]'

          while IFS=$'\t' read -r tag id prerelease; do
            [[ -n "$tag" ]] || continue
            synced_ref="refs/tags/upstream/$tag"
            source_ref="refs/tags/macos-source/$tag"
            built_ref="refs/tags/macos-built/$tag"
            if ! git show-ref --verify --quiet "$synced_ref"; then
              git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$tag"
              release_ref=$(git rev-parse --verify FETCH_HEAD)
              git merge --no-edit 'FETCH_HEAD^{commit}'
              git push --atomic origin HEAD:refs/heads/main "$release_ref:$synced_ref" "HEAD:$source_ref"
              git update-ref "$source_ref" HEAD
            elif ! git show-ref --verify --quiet "$source_ref"; then
              # A release already synced by the original workflow.
              git push origin "$synced_ref^{commit}:$source_ref"
              git update-ref "$source_ref" "$synced_ref^{commit}"
            fi
            if git show-ref --verify --quiet "$built_ref" && [[ "$MANUAL:$id" != "true:$latest" ]]; then
              continue
            fi
            sha=$(git rev-parse "$source_ref")
            label=$(printf '%s' "$tag" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-60)
            pending=$(jq -c --arg tag "$tag" --arg sha "$sha" --arg name "ISCC-${label}-${id}" --argjson prerelease "$prerelease" \
              '. + [{tag:$tag, sha:$sha, name:$name, prerelease:$prerelease}]' <<< "$pending")
          done < <(jq -r '.[] | [.tag_name, .id, .prerelease] | @tsv' <<< "$releases")

          matrix=$(jq -c '[.[] as $release |
            $release + {runner:"macos-15", arch:"arm64"},
            $release + {runner:"macos-15-intel", arch:"x64"}]' <<< "$pending")
          echo "releases=$pending" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  macos:
    needs: sync
    if: needs.sync.outputs.matrix != '[]'
    name: macOS ${{ matrix.arch }} · ${{ matrix.tag }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.sync.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: iziziz-indepstate/indepstate-cc
          ref: 19262f3253f14570fb96fafa63e233e71d63617e # v1.2.0
          path: base-app
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify and integrate the release
        env:
          SOURCE_SHA: ${{ matrix.sha }}
        run: |
          kit="$RUNNER_TEMP/iscc-kit"
          mkdir "$kit"
          git archive "$SOURCE_SHA" | tar -xf - -C "$kit"
          # Fork automation lives outside the upstream distribution manifest.
          rm -rf "$kit/.github"
          npm --prefix "$kit" test
          python3 .github/iscc-macos/assemble.py "$kit" base-app
      - name: Test ISCC
        working-directory: base-app
        run: |
          npm install --no-audit --no-fund
          npm test
          node --test ../.github/iscc-macos/integration.test.js
      - name: Sign and notarize ISCC
        working-directory: base-app
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret $name"
              exit 1
            fi
          done
          key_dir=$(mktemp -d "$RUNNER_TEMP/iscc-notary.XXXXXX")
          trap 'rm -rf "$key_dir"' EXIT
          export APPLE_API_KEY="$key_dir/AuthKey.p8"
          (umask 077; printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$APPLE_API_KEY")
          unset APPLE_API_KEY_BASE64
          npx --no-install electron-builder --mac dir "--$ARCH" --publish never \
            --config.forceCodeSigning=true --config.mac.type=distribution \
            --config.mac.hardenedRuntime=true --config.mac.notarize=true
      - name: Verify and package the notarized app
        working-directory: base-app
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          ARTIFACT: ${{ matrix.name }}-macos-${{ matrix.arch }}.zip
        run: |
          app=$(find dist -name ISCC.app -type d -print -quit)
          test -n "$app"
          if [[ "$ARCH" == x64 ]]; then expected=x86_64; else expected=arm64; fi
          test "$(lipo -archs "$app/Contents/MacOS/ISCC")" = "$expected"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          syspolicy_check distribution "$app"
          ELECTRON_RUN_AS_NODE=1 "$app/Contents/MacOS/ISCC" -e 'if (!process.versions.electron) process.exit(1)'
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/$ARTIFACT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: base-app/dist/${{ matrix.name }}-macos-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error

  publish:
    needs: [sync, macos]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ISCC-*-macos-*.zip
          path: ${{ runner.temp }}/macos-artifacts
          merge-multiple: true
          skip-decompress: true
      - name: Publish macOS releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ needs.sync.outputs.releases }}
        run: |
          while IFS=$'\t' read -r tag sha name prerelease; do
            assets=$(mktemp -d)
            for arch in arm64 x64; do
              cp "$RUNNER_TEMP/macos-artifacts/$name-macos-$arch.zip" "$assets/ISCC-macos-$arch-notarized.zip"
            done
            bash .github/iscc-macos/publish-release.sh "$tag" "$sha" "$prerelease" "$assets"
            git push origin "$sha:refs/tags/macos-built/$tag"
          done < <(jq -r '.[] | [.tag, .sha, .name, .prerelease] | @tsv' <<< "$RELEASES")
